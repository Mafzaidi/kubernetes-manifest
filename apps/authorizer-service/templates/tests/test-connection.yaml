apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "authorizer-service.fullname" . }}-authorizer-service-connection"
  labels:
    {{- include "authorizer-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": authorizer-service
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "authorizer-service.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
