apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "authorizer.fullname" . }}-authorizer-connection"
  labels:
    {{- include "authorizer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": authorizer
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "authorizer.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
