apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authorizer-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=docker.io/mafzaidi93/authorizer

    argocd-image-updater.argoproj.io/app.update-strategy: latest
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^.*-dev.*

    argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag

    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: dev
spec:
  project: default
  source:
    repoURL: https://github.com/Mafzaidi/kubernetes-manifest.git
    targetRevision: dev
    path: apps/authorizer
    helm:
      valueFiles:
        - values.dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authorizer-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true