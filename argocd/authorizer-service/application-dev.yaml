apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authorizer-service-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mafzaidi/kubernetes-manifest.git
    targetRevision: dev
    path: apps/authorizer-service
    helm:
      valueFiles:
        - values.dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authorizer-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true